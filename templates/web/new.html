<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Outline Example</title>
  <style>
    .outlined-text {
      color: black; /* Text color */
      font-size: 60px;
      text-shadow: 
        -1px -1px 0 blue,  
         1px -1px 0 blue,
        -1px  1px 0 blue,
         2px  2px 0 blue; /* Outline color and thickness */
    }
  </style>
</head>
<body>

<h1 class="outlined-text">Outlined Text</h1>

</body>
</html>
